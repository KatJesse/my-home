{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>{% if first %}Ersteinrichtung{% else %}Anmelden{% endif %}</h1>{% if first %}<p>Erstelle das erste Administratorkonto. Das Passwort muss mindestens 12 Zeichen haben.</p>{% endif %}{% if error %}<p class="error">{{error}}</p>{% endif %}<form action="/login" method="post" class="stack"><label>Benutzername<input name="username" required autocomplete="username"></label><label>Passwort<input type="password" name="password" required minlength="12" autocomplete="current-password"></label><button>Anmelden / einrichten</button></form></section>{% endblock %}
