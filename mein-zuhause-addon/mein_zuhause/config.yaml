name: Mein Zuhause
version: "0.1.0"
slug: mein_zuhause
description: Private Haushaltswissensdatenbank mit OCR und PDF-Export
url: https://github.com/DEIN-NAME/mein-zuhause-addon
arch:
  - aarch64
  - armv7
  - amd64
init: false
startup: services
boot: auto
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Mein Zuhause Weboberflaeche
webui: http://[HOST]:[PORT:8099]
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
options:
  pdf_directory: /share/mein-zuhause-pdf
  ocr_languages: deu+eng
schema:
  pdf_directory: str
  ocr_languages: str
