{% extends 'base.html' %}{% block content %}<div class="top"><h1>Einkaufszettel</h1></div>{% if user.role!='reader' %}<section class="panel"><h3>Artikel hinzufügen</h3><form action="/shopping" method="post" class="filters"><input name="name" required placeholder="Lebensmittel / Artikel"><input name="quantity" type="number" step="any" placeholder="Menge"><input name="unit" placeholder="Einheit"><input name="store" placeholder="Geschäft (optional)"><button>Hinzufügen</button></form></section>{% endif %}<form action="/shopping" method="get" class="filters"><select name="store"><option value="">Alle Geschäfte</option>{% for s in stores %}<option value="{{s}}" {% if store==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Filtern</button></form>{% for i in items %}<div class="row-card"><form action="/shopping/{{i.id}}" method="post" class="inline-form"><label><input style="width:auto" type="checkbox" name="checked" value="yes" {% if i.checked %}checked{% endif %}> Erledigt</label><input name="name" required value="{{i.name}}" style="{% if i.checked %}text-decoration:line-through{% endif %}"><input type="number" step="any" name="quantity" value="{{i.quantity if i.quantity is not none else ''}}" placeholder="Menge"><input name="unit" value="{{i.unit or ''}}" placeholder="Einheit"><input name="store" value="{{i.store or ''}}" placeholder="Geschäft">{% if user.role!='reader' %}<button class="mini" name="action" value="save">Speichern</button><button class="mini" name="action" value="up" title="Nach oben">↑</button><button class="mini" name="action" value="down" title="Nach unten">↓</button><button class="danger mini" name="action" value="delete" onclick="return confirm('Entfernen?')">×</button>{% endif %}</form></div>{% else %}<p>Der Einkaufszettel ist leer.</p>{% endfor %}{% endblock %}
