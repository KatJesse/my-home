{% extends 'base.html' %}{% block content %}<div class="top"><h1>{{'Kiste bearbeiten' if item else 'Kiste / Gegenstand anlegen'}}</h1><a href="/storage">← Lager</a></div><section class="panel"><form action="/storage/box" method="post" class="stack"><input type="hidden" name="id" value="{{item.id if item else 0}}"><div class="grid-form"><label>Kistennummer *<input name="number" required value="{{item.number if item else ''}}" placeholder="K-001"></label><label>Bezeichnung *<input name="title" required value="{{item.title if item else ''}}"></label><label>Lagerort<select name="place_id"><option value="0">Ohne Lagerort</option>{% for p in places %}<option value="{{p.id}}" {% if item and item.place_id==p.id %}selected{% endif %}>{{p.name}}</option>{% endfor %}</select></label><label>Stichworte<input name="keywords" value="{{item.keywords if item else ''}}" placeholder="Weihnachten, Werkzeug …"></label></div><label>Metadaten (Freitext)<textarea name="metadata" rows="3">{{item.metadata if item else ''}}</textarea></label><label>Inhalt / Notizen<textarea name="notes" rows="5">{{item.notes if item else ''}}</textarea></label><button>Speichern</button></form></section>{% if item %}<section class="panel"><h2>Foto</h2>{% if item.image_id %}<img class="storage-img" src="/storage/image/{{item.id}}" alt="Kistenfoto">{% endif %}<form class="stack" method="post" action="/storage/box/{{item.id}}/image" enctype="multipart/form-data"><input type="file" name="file" accept="image/*" required><button>Foto hochladen / ersetzen</button></form></section>{% endif %}{% endblock %}
