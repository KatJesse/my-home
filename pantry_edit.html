{% extends 'base.html' %}{% block content %}<div class="top"><h1>{{'Lebensmittel bearbeiten' if item else 'Lebensmittel anlegen'}}</h1><a href="/pantry">← Vorräte</a></div><section class="panel"><form action="/pantry/item" method="post" class="stack"><input type="hidden" name="id" value="{{item.id if item else 0}}"><div class="grid-form"><label>Bezeichnung *<input name="name" required value="{{item.name if item else ''}}"></label><label>Menge<input type="number" step="any" min="0" name="quantity" value="{{item.quantity if item and item.quantity is not none else ''}}"></label><label>Einheit<input name="unit" list="units" value="{{item.unit if item else ''}}"><datalist id="units"><option>Stück</option><option>kg</option><option>g</option><option>l</option><option>ml</option><option>Packungen</option></datalist></label><label>Mindestlagermenge<input type="number" step="any" min="0" name="minimum" value="{{item.minimum if item and item.minimum is not none else ''}}"></label><label>Ablaufdatum<input type="date" name="expires" value="{{item.expires if item and item.expires else ''}}"></label><label>Einfrierdatum<input id="frozen" type="date" name="frozen" value="{{item.frozen if item and item.frozen else ''}}"><button type="button" class="mini" onclick="document.getElementById('frozen').value=new Date().toLocaleDateString('en-CA')">Heute</button></label><label>Kategorie<select name="category_id"><option value="0">Keine</option>{% for c in pcats %}<option value="{{c.id}}" {% if item and item.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Regalfach / Lagerplatz<select name="shelf_id"><option value="0">Kein Regalfach</option>{% for s in shelves %}<option value="{{s.id}}" {% if item and item.shelf_id==s.id %}selected{% endif %}>{{s.location}} / {{s.name}}</option>{% endfor %}</select></label><label>Geöffnet<select name="opened"><option value="no">Nein</option><option value="yes" {% if item and item.opened %}selected{% endif %}>Ja</option></select></label><label>Bereits entnommene Menge<input type="number" step="any" min="0" name="used_amount" value="{{item.used_amount if item and item.used_amount is not none else ''}}"></label><label>Barcode (optional)<input name="barcode" value="{{item.barcode if item else ''}}"></label></div><label>Notizen<textarea name="notes" rows="4">{{item.notes if item else ''}}</textarea></label><button>Speichern</button></form></section>{% endblock %}
